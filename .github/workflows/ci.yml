name: "ci"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--no-bundle"
          - platform: "ubuntu-22.04"
            args: "--no-bundle"
          - platform: "windows-latest"
            args: "--no-bundle"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "yarn"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: yarn install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

  build-android:
    runs-on: ubuntu-22.04
    env:
      # Secrets are unavailable on PRs from forks; without them a debug APK is built instead.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
      RUSTFLAGS: >-
        --remap-path-prefix=${{ github.workspace }}=/build
        --remap-path-prefix=/home/runner/.cargo=/cargo
        --remap-path-prefix=/home/runner/.rustup=/rustup
      CFLAGS: >-
        -ffile-prefix-map=${{ github.workspace }}=/build
        -ffile-prefix-map=/home/runner/.cargo=/cargo
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: setup Android SDK
        uses: android-actions/setup-android@v4

      - name: install NDK
        run: sdkmanager "ndk;30.0.16138531"

      - name: install frontend dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: setup Android signing
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16138531
        with:
          mobile: "android"
          args: ${{ env.HAS_KEYSTORE == 'true' && '--apk --target aarch64' || '--apk --debug --target aarch64' }}

      - name: upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaski-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
