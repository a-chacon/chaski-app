[package]
name = "chaski"
version = "0.6.0"
description = "A beautifully designed, privacy-focused feed reader that keeps you updated."
authors = ["a-chacon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
diesel = { version = "2.3.11", features = [
  "sqlite",
  "returning_clauses_for_sqlite_3_35",
  "chrono",
] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
dotenvy = "0.15"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
] }
atom_syndication = "0.12.9"
rss = "2.1.0"
scraper = "0.24.0"
tokio = { version = "1.53.1", features = ["full"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
env_logger = "0.11.11"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
opml = "1.1.6"
tauri-plugin-log = "2"
log = "0.4.33"
regex = "1.13.1"
readability-rs = "0.5.0"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
urlencoding = "2.1"
tauri-plugin-os = "2"
readabilityrs = "0.1.3"


[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
